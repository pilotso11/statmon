name: Go Build and Test

on:
  push:
    branches: [ main, master ] # Adjust to your default branch
  pull_request:
    branches: [ main, master ] # Adjust to your default branch

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # Specify your Go version

    - name: Build
      run: go build -v -o go-monitor main.go

    - name: Test
      run: go test -v ./...
    # Add -race flag for race detection if appropriate for your tests, e.g.:
    # run: go test -race -v ./...
    #
    # Optional: Upload artifact (the built binary)
    # - name: Upload go-monitor binary
    #   uses: actions/upload-artifact@v3
    #   with:
    #     name: go-monitor-linux-amd64
    #     path: go-monitor
